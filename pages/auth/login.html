<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - Absen Sumpay</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />

    <link
      rel="icon"
      href="../../assets/images/favico.ico"
      type="image/x-icon"
    />
  </head>

  <body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <div class="flex flex-col items-center mb-8">
        <img
          src="../../assets/images/sumpayblack.webp"
          alt="Logo Absen Sumpay"
          class="w-36 object-contain"
        />
      </div>

      <!-- Card -->
      <div class="bg-white shadow-lg rounded-2xl p-8">
        <form id="loginForm" class="space-y-5">
          <div class="text-center">
            <h1 class="text-2xl font-semibold text-gray-800">Log in</h1>
          </div>

          <!-- Identifier -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              NIP
            </label>
            <input
              type="text"
              name="identifier"
              required
              class="w-full rounded-xl border border-gray-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#C3D9E6] focus:border-[#C3D9E6] transition"
              placeholder="Masukkan NIP"
            />
          </div>

          <!-- Password -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Password
            </label>

            <div class="relative">
              <input
                type="password"
                name="password"
                id="passwordInput"
                required
                class="w-full rounded-xl border border-gray-300 px-4 py-2.5 pr-12 focus:outline-none focus:ring-2 focus:ring-[#C3D9E6] focus:border-[#C3D9E6] transition"
                placeholder="Masukkan password"
              />

              <button
                type="button"
                id="togglePassword"
                class="absolute inset-y-0 right-0 px-4 flex items-center text-gray-500 hover:text-gray-700"
              >
                <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
              </button>
            </div>
          </div>

          <!-- Error Message -->
          <div id="errorMessage" class="hidden text-sm text-red-500">
            Login gagal. Periksa kembali data Anda.
          </div>

          <button
            type="submit"
            id="loginButton"
            class="w-full bg-[#C3D9E6] hover:brightness-95 text-gray-800 font-medium py-2.5 rounded-xl transition duration-200 shadow-sm flex items-center justify-center gap-2"
          >
            <span id="loginText"> Masuk </span>

            <svg
              id="loginSpinner"
              class="hidden animate-spin w-5 h-5"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>

              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              ></path>
            </svg>
          </button>
        </form>
      </div>

      <!-- Footer kecil -->
      <p class="text-center text-xs text-gray-400 mt-6">© 2026 Absen Sumpay</p>
    </div>

    <!-- icon -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="../../js/login.js"></script>
  </body>
</html>
