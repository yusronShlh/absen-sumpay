<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Data Guru</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />

    <link
      rel="icon"
      href="../../assets/images/favico.ico"
      type="image/x-icon"
    />
  </head>

  <body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen">
      <!-- OVERLAY (mobile) -->

      <div id="sidebar-container"></div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 w-full overflow-y-auto">
        <!-- MOBILE TOP NAV -->
        <div
          class="md:hidden flex justify-between items-center bg-[#C3D9E6] p-4"
        >
          <h2 class="font-bold text-[#1E3A5F]">SUMPAY.Edu</h2>
          <button onclick="toggleSidebar()" class="text-2xl text-[#1E3A5F]">
            ☰
          </button>
        </div>
        <div class="p-6 md:p-8">
          <!-- HEADER -->
          <div
            class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8"
          >
            <div>
              <h2 class="text-3xl font-bold text-[#1E3A5F]">
                Kelola Data Guru
              </h2>
              <!-- <p class="text-gray-500 text-sm">Manajemen data kelas sekolah</p> -->
            </div>

            <div class="flex gap-2">
              <button
                id="btnDownloadTemplate"
                class="flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-100 transition-all duration-200"
              >
                <i data-lucide="download-cloud" class="w-4 h-4"></i>
                Template
              </button>

              <button
                id="btnImportTeacher"
                class="flex items-center gap-2 bg-blue-50 text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-100 transition-all duration-200"
              >
                <i data-lucide="file-up" class="w-4 h-4"></i>
                Import Excel
              </button>

              <button
                id="btnAddTeachers"
                class="flex items-center gap-2 bg-[#1E3A5F] text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-[#2a5285] transition-all duration-200 shadow-md active:scale-95"
              >
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                Tambah Guru
              </button>
            </div>
          </div>

          <!-- CARD TABLE -->
          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <!-- TABLE WRAPPER -->
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm text-left">
                <thead class="bg-[#C3D9E6]/40 text-[#1E3A5F]">
                  <tr>
                    <th class="px-6 py-4">No</th>
                    <th class="px-6 py-4">Nama</th>
                    <th class="px-6 py-4">NIP</th>
                    <th class="px-6 py-4 text-center">Action</th>
                  </tr>
                </thead>

                <tbody id="teacherTableBody" class="divide-y divide-gray-100">
                  <!-- DATA DINAMIS DARI JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR SCRIPT -->
    <script type="module">
      import { loadSidebar } from "../../js/components/sidebar.js";

      loadSidebar();
    </script>

    <!-- SWEETALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- icon -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <!-- =============== -->
    <!--  MODAL DIALOG -->
    <!-- =============== -->
    <!-- MODAL GURU -->
    <div
      id="teacherModal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 z-50"
    >
      <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 relative">
        <h3 id="modalTitle" class="text-xl font-bold mb-6 text-[#1E3A5F]">
          Tambah Guru
        </h3>

        <form id="teacherForm" class="space-y-4">
          <input type="hidden" id="teacherId" />

          <div>
            <label class="block text-sm mb-1">Nama</label>
            <input
              id="name"
              type="text"
              class="w-full p-2 border rounded-lg"
              required
            />
          </div>

          <div>
            <label class="block text-sm mb-1">NIP</label>
            <input
              id="nip"
              type="text"
              class="w-full p-2 border rounded-lg"
              required
            />
          </div>

          <div id="passwordGroup">
            <label class="block text-sm mb-1">Password</label>

            <input
              id="password"
              type="password"
              class="w-full p-2 border rounded-lg"
            />

            <p id="passwordHint" class="hidden text-xs text-gray-400 mt-1">
              Kosong jika tidak ingin mengubah Password baru guru
            </p>
          </div>

          <div class="flex justify-end gap-2 pt-4">
            <button
              type="button"
              id="btnCloseModal"
              class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300"
            >
              Batal
            </button>

            <button
              type="submit"
              class="px-4 py-2 rounded-lg bg-[#1E3A5F] text-white hover:opacity-90"
            >
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- IMPORT MODAL -->
    <div
      id="importModal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 z-50"
    >
      <div class="bg-white rounded-xl p-6 w-full max-w-md">
        <h3 class="text-xl font-bold mb-4">Import Data Guru</h3>
        <input
          type="file"
          id="excelFile"
          accept=".xlsx, .xls"
          class="border p-2 w-full"
        />
        <div class="flex justify-end gap-2 mt-5">
          <button id="btnCloseImport" class="bg-gray-200 px-4 py-2 rounded">
            Batal
          </button>

          <button
            id="btnSubmitImport"
            class="bg-[#1E3A5F] text-white px-4 p-2 rounded"
          >
            Import
          </button>
        </div>
      </div>
    </div>

    <!-- JS MODULE -->
    <script type="module" src="../../js/teachers.js"></script>
  </body>
</html>
