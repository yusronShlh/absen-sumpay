<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Data Siswa</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />

    <link
      rel="icon"
      href="../../assets/images/favico.ico"
      type="image/x-icon"
    />
  </head>

  <body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen">
      <div id="sidebar-container"></div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 w-full overflow-y-auto">
        <!-- MOBILE TOP NAV -->
        <div
          class="md:hidden flex justify-between items-center bg-[#C3D9E6] p-4"
        >
          <h2 class="font-bold text-[#1E3A5F]">SUMPAY.Edu</h2>
          <button onclick="toggleSidebar()" class="text-2xl text-[#1E3A5F]">
            ☰
          </button>
        </div>
        <div class="p-6 md:p-8">
          <!-- HEADER -->

          <div>
            <h2 class="text-3xl font-bold text-[#1E3A5F]">Kelola Data Siswa</h2>
            <!-- <p class="text-gray-500 text-sm">Manajemen data kelas sekolah</p> -->
          </div>

          <div
            class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 mt-6"
          >
            <!-- Filter Kelas -->
            <div class="w-full md:w-auto">
              <!-- <label class="block font-medium text-gray-600">
                Filter Kelas
              </label> -->

              <select
                id="filterKelas"
                class="w-full md:w-54 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="">Semua Kelas</option>
                <!-- <option value="1A">Kelas 1A</option>
                <option value="1B">Kelas 1B</option>
                <option value="2A">Kelas 2A</option> -->
              </select>
            </div>

            <div class="flex gap-3 flex-wrap items-center">
              <!-- Kelompok Aksi Massal (Style Outline/Ghost agar tidak terlalu ramai) -->
              <button
                id="btnPromoteStudent"
                class="flex items-center gap-2 bg-white text-amber-600 border border-amber-200 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-amber-50 hover:border-amber-400 transition-all duration-200 shadow-sm"
              >
                <i data-lucide="trending-up" class="w-4 h-4"></i>
                Naikkan Kelas
              </button>

              <button
                id="btnGraduateStudent"
                class="flex items-center gap-2 bg-white text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-50 hover:border-red-400 transition-all duration-200 shadow-sm"
              >
                <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                Luluskan
              </button>

              <!-- Kelompok Data (Soft background) -->
              <button
                id="btnDownloadTemplate"
                class="flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-100 transition-all duration-200"
              >
                <i data-lucide="download-cloud" class="w-4 h-4"></i>
                Template
              </button>

              <button
                id="btnImportStudent"
                class="flex items-center gap-2 bg-blue-50 text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-100 transition-all duration-200"
              >
                <i data-lucide="file-up" class="w-4 h-4"></i>
                Import Excel
              </button>

              <!-- Primary Action (Solid background) -->
              <button
                id="btnAddStudents"
                class="flex items-center gap-2 bg-[#1E3A5F] text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-[#2a5285] transition-all duration-200 shadow-md active:scale-95"
              >
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                Tambah Siswa
              </button>
            </div>
          </div>

          <!-- CARD TABLE -->
          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <!-- TABLE WRAPPER -->
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm text-left">
                <thead class="bg-[#C3D9E6]/40 text-[#1E3A5F]">
                  <tr>
                    <th class="px-3 md:px-6 py-3 md:py-4">No</th>
                    <th class="px-3 md:px-6 py-3 md:py-4">Nama</th>
                    <th class="px-3 md:px-6 py-3 md:py-4">NISN</th>
                    <th class="px-3 md:px-6 py-3 md:py-4">Jenis Kelamin</th>
                    <th
                      class="px-3 md:px-6 py-3 md:py-4 text-center whitespace-nowrap"
                    >
                      Action
                    </th>
                  </tr>
                </thead>

                <tbody id="tableSiswaBody" class="divide-y divide-gray-100">
                  <!-- DATA DINAMIS DARI JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR SCRIPT -->
    <script type="module">
      import { loadSidebar } from "../../js/components/sidebar.js";

      loadSidebar();
    </script>

    <!-- SWEETALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- icon -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MODAL SISWA -->
    <div
      id="studentModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50"
    >
      <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl p-6 relative">
        <h3 id="modalTitle" class="text-xl font-bold text-[#1E3A5F] mb-6">
          Tambah Siswa
        </h3>

        <form id="studentForm" class="space-y-4">
          <input type="hidden" id="studentId" />

          <div>
            <label class="block text-sm font-medium mb-1">Nama Siswa</label>
            <input
              type="text"
              id="nama"
              class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">NISN</label>
            <input
              type="text"
              id="nisn"
              class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
              required
            />
          </div>

          <div id="passwordGroup">
            <label class="block text-sm font-medium mb-1">Password</label>

            <input
              type="password"
              id="password"
              class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
            />

            <p id="passwordHint" class="hidden text-xs text-gray-400 mt-1">
              Password tidak dapat diubah melalui menu ini.
            </p>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Jenis Kelamin</label>
            <select
              id="jenisKelamin"
              class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
              required
            >
              <option value="">Pilih Jenis Kelamin</option>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Kelas</label>
            <select
              id="kelas"
              class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
              required
            >
              <option value="">Pilih Kelas</option>
              <option value="1A">1A</option>
              <option value="1B">1B</option>
              <option value="2A">2A</option>
            </select>
          </div>

          <div class="flex justify-end gap-3 pt-4">
            <button
              type="button"
              id="btnCloseModal"
              class="px-4 py-2 rounded-lg border hover:bg-gray-100"
            >
              Batal
            </button>

            <button
              type="submit"
              class="px-5 py-2 bg-[#1E3A5F] text-white rounded-lg hover:opacity-90"
            >
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL NAIK KELAS -->
    <div
      id="promoteModal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 z-50"
    >
      <div class="bg-white p-6 rounded-xl w-full max-w-md">
        <h3 class="text-xl font-bold mb-4">Naikkan Kelas</h3>

        <label> Pindah ke kelas: </label>

        <select id="promoteTargetClass" class="w-full border p-2 rounded">
          <option value="">Pilih kelas tujuan</option>
        </select>

        <div class="flex justify-end gap-2 mt-5">
          <button id="btnClosePromote" class="bg-gray-200 px-4 py-2 rounded">
            Batal
          </button>

          <button
            id="btnSubmitPromote"
            class="bg-yellow-500 text-white px-4 py-2 rounded"
          >
            Naikkan
          </button>
        </div>
      </div>
    </div>

    <!-- Modal import -->
    <div
      id="importModal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 z-50"
    >
      <div class="bg-white rounded-xl p-6 w-full max-w-md">
        <h3 class="text-xl font-bold mb-4">Import Data Siswa</h3>

        <input
          id="excelFile"
          type="file"
          accept=".xlsx,.xls"
          class="border p-2 w-full"
        />

        <div class="flex justify-end gap-2 mt-5">
          <button id="btnCloseImport" class="bg-gray-200 px-4 py-2 rounded">
            Batal
          </button>

          <button
            id="btnSubmitImport"
            class="bg-[#1E3A5F] text-white px-4 py-2 rounded"
          >
            Import
          </button>
        </div>
      </div>
    </div>

    <!-- JS MODULE -->
    <script type="module" src="../../js/students.js"></script>
  </body>
</html>
