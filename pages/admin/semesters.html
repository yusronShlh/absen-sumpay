<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Semester</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />
  </head>

  <body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen">
      <div id="sidebar-container"></div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 w-full overflow-y-auto">
        <!-- MOBILE TOP NAV -->
        <div
          class="md:hidden flex justify-between items-center bg-[#C3D9E6] p-4"
        >
          <h2 class="font-bold text-[#1E3A5F]">SUMPAY.Edu</h2>
          <button onclick="toggleSidebar()" class="text-2xl text-[#1E3A5F]">
            ☰
          </button>
        </div>
        <div class="p-6 md:p-8">
          <!-- HEADER -->
          <div
            class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8"
          >
            <div>
              <h2 class="text-3xl font-bold text-[#1E3A5F]">Kelola Semester</h2>
              <!-- <p class="text-gray-500 text-sm">Manajemen data kelas sekolah</p> -->
            </div>

            <button
              id="btnAddSemester"
              class="self-end md:self-auto bg-[#1E3A5F] text-white px-5 py-2.5 rounded-xl shadow hover:opacity-90 transition flex items-center gap-2"
            >
              <span class="text-lg">＋</span>
              Tambah Semester
            </button>
          </div>

          <!-- CARD TABLE -->
          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <!-- TABLE WRAPPER -->
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm text-left table-fixed">
                <thead class="bg-[#C3D9E6]/40 text-[#1E3A5F]">
                  <tr>
                    <th class="px-3 md:px-6 py-3 md:py-4 w-16 text-center">
                      No
                    </th>
                    <th class="px-3 md:px-6 py-3 md:py-4 w-48 text-left">
                      Tahun Ajaran
                    </th>
                    <th class="px-3 md:px-6 py-3 md:py-4 text-center">
                      Semester
                    </th>
                    <th class="px-3 md:px-6 py-3 md:py-4 text-center">
                      Tanggal Mulai
                    </th>
                    <th class="px-3 md:px-6 py-3 md:py-4 text-center">
                      Tanggal Selesai
                    </th>
                    <th
                      class="px-3 md:px-6 py-3 md:py-4 text-center whitespace-nowrap"
                    >
                      Action
                    </th>
                  </tr>
                </thead>

                <tbody id="tableSemesterBody" class="divide-y divide-gray-100">
                  <!-- DATA DINAMIS DARI JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR SCRIPT -->
    <script type="module">
      import { loadSidebar } from "../../js/components/sidebar.js";

      loadSidebar();
    </script>

    <!-- SWEETALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- icon -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- modal dialog -->
    <!-- MODAL SEMESTER -->
    <div
      id="semesterModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50"
    >
      <div class="bg-white w-full max-w-lg mx-4 rounded-2xl shadow-xl">
        <!-- HEADER -->
        <div class="flex justify-between items-center p-6">
          <h3 id="modalTitle" class="text-xl font-bold text-[#1E3A5F]">
            Tambah Semester
          </h3>
          <button id="closeModal" class="text-xl">✕</button>
        </div>

        <!-- BODY -->
        <div class="p-6 space-y-4">
          <input type="hidden" id="semesterId" />

          <div>
            <label class="text-sm font-semibold">Tahun Ajaran</label>
            <input
              id="academicYear"
              type="text"
              class="w-full border p-2 rounded-lg"
              placeholder="2025/2026"
            />
          </div>

          <div>
            <label class="text-sm font-semibold">Semester</label>
            <select
              id="semesterType"
              class="w-full border p-2 rounded-lg"
            ></select>
          </div>

          <div>
            <label class="text-sm font-semibold">Tanggal Mulai</label>
            <input
              id="startDate"
              type="date"
              class="w-full border p-2 rounded-lg"
            />
          </div>

          <div>
            <label class="text-sm font-semibold">Tanggal Selesai</label>
            <input
              id="endDate"
              type="date"
              class="w-full border p-2 rounded-lg"
            />
          </div>
        </div>

        <!-- FOOTER -->
        <div class="flex justify-end gap-3 p-6">
          <button id="btnCancel" class="px-4 py-2 border rounded-lg">
            Batal
          </button>
          <button
            id="btnSave"
            class="px-4 py-2 bg-[#1E3A5F] text-white rounded-lg"
          >
            Simpan
          </button>
        </div>
      </div>
    </div>
    <!-- JS MODULE -->
    <script type="module" src="../../js/semesters.js"></script>
  </body>
</html>
