<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />
  </head>

  <body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen overflow-hidden">
      <div id="sidebar-container"></div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 w-full overflow-y-auto">
        <!-- MOBILE TOP NAV -->
        <div
          class="md:hidden flex justify-between items-center bg-[#C3D9E6] p-4"
        >
          <h2 class="font-bold text-[#1E3A5F]">SUMPAY.Edu</h2>
          <button onclick="toggleSidebar()" class="text-2xl text-[#1E3A5F]">
            ☰
          </button>
        </div>

        <div class="p-6 md:p-8">
          <!-- TOP HEADER (desktop) -->
          <div class="mb-8 hidden md:block">
            <h2 class="text-3xl font-bold text-[#1E3A5F]">Dashboard</h2>
            <p class="text-gray-500 text-sm">Ringkasan data sistem absensi</p>
          </div>

          <!-- SUMMARY CARDS -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-10">
            <div
              class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"
            >
              <p class="text-gray-400 text-sm">Total Siswa</p>
              <h3
                id="totalStudents"
                class="text-3xl font-bold text-slate-800 mt-2"
              >
                0
              </h3>
            </div>

            <div
              class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"
            >
              <p class="text-gray-400 text-sm">Laki-laki</p>
              <h3
                id="maleStudents"
                class="text-3xl font-bold text-slate-800 mt-2"
              >
                0
              </h3>
            </div>

            <div
              class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"
            >
              <p class="text-gray-400 text-sm">Perempuan</p>
              <h3
                id="femaleStudents"
                class="text-3xl font-bold text-slate-800 mt-2"
              >
                0
              </h3>
            </div>

            <div
              class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"
            >
              <p class="text-gray-400 text-sm">Total Guru</p>
              <h3
                id="totalTeachers"
                class="text-3xl font-bold text-slate-800 mt-2"
              >
                0
              </h3>
            </div>
          </div>

          <!-- IZIN HARI INI -->
          <div class="grid grid-cols-2 gap-4 md:gap-6 mb-10">
            <div class="bg-[#C3D9E6] p-6 rounded-xl">
              <p class="text-slate-700 text-sm">Izin Siswa Hari Ini</p>
              <h3
                id="todayStudentPermits"
                class="text-2xl font-bold text-slate-800 mt-2"
              >
                0
              </h3>
            </div>

            <div class="bg-[#C3D9E6] p-6 rounded-xl">
              <p class="text-slate-700 text-sm">Izin Guru Hari Ini</p>
              <h3
                id="todayTeacherPermits"
                class="text-2xl font-bold text-slate-800 mt-2"
              >
                0
              </h3>
            </div>
          </div>

          <!-- CHART -->
          <div
            class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100"
          >
            <h3 class="text-lg font-semibold text-[#1E3A5F] mb-6">
              Statistik Siswa Per Kelas
            </h3>

            <div class="h-80">
              <canvas id="classChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { loadSidebar } from "../../js/components/sidebar.js";

      loadSidebar();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script type="module" src="../../js/dashboard.js"></script>
  </body>
</html>
