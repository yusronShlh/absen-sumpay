<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoring absen</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />

    <link
      rel="icon"
      href="../../assets/images/favico.ico"
      type="image/x-icon"
    />
  </head>

  <body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen">
      <div id="sidebar-container"></div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 w-full overflow-y-auto">
        <!-- MOBILE TOP NAV -->
        <div
          class="md:hidden flex justify-between items-center bg-[#C3D9E6] p-4"
        >
          <h2 class="font-bold text-[#1E3A5F]">SUMPAY.Edu</h2>
          <button onclick="toggleSidebar()" class="text-2xl text-[#1E3A5F]">
            ☰
          </button>
        </div>
        <div class="p-6 md:p-8">
          <!-- HEADER -->
          <div>
            <h2 class="text-3xl font-bold text-[#1E3A5F]">Monitoring Absen</h2>
          </div>

          <div
            class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 mt-6"
          >
            <!-- Filter Kelas -->
            <div class="w-full md:w-auto">
              <label class="block text-sm font-semibold text-slate-600 mb-2">
                Pilih Tanggal
              </label>

              <div class="relative">
                <input
                  type="date"
                  id="filterTanggal"
                  class="w-full md:w-56 pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl shadow-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
                />
              </div>
            </div>

            <!-- Filter Kelas -->
            <div class="w-full md:w-auto">
              <label class="block text-sm font-semibold text-slate-600 mb-2">
                Pilih Kelas
              </label>

              <select
                id="filterKelas"
                class="w-full md:w-54 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="">1 IPS</option>
                <!-- <option value="1A">Kelas 1A</option>
                <option value="1B">Kelas 1B</option>
                <option value="2A">Kelas 2A</option> -->
              </select>
            </div>
          </div>

          <!-- CARD TABLE -->
          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <!-- TABLE WRAPPER -->
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm text-left">
                <thead class="bg-[#C3D9E6]/40 text-[#1E3A5F]">
                  <tr>
                    <th class="px-4 py-4 min-w-[140px]">Jam ke-</th>
                    <th class="px-6 py-4 min-w-[160px] text-left">
                      mata pelajaran
                    </th>
                    <th class="px-6 py-4 min-w-[140px]">Guru</th>
                    <th class="px-6 py-4 min-w-[140px]">Status</th>
                    <th class="px-6 py-4 min-w-[140px]">Keterangan</th>
                    <th class="px-6 py-4 min-w-[140px]">act</th>
                  </tr>
                </thead>

                <tbody
                  id="AttendanceMonitoringTableBody"
                  class="divide-y divide-gray-100"
                >
                  <!-- DATA DINAMIS DARI JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR SCRIPT -->
    <script type="module">
      import { loadSidebar } from "../../js/components/sidebar.js";

      loadSidebar();
    </script>

    <!-- SWEETALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- icon -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <!-- MODAL EDIT ATTENDANCE -->
    <div
      id="attendanceModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-[60]"
    >
      <div class="bg-white w-full max-w-4xl mx-4 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center p-6">
          <h3 class="text-xl font-bold text-[#1E3A5F]">
            Edit Alpha / Input Absen
          </h3>

          <button id="closeAttendanceModal" class="text-xl">✕</button>
        </div>

        <div id="attendanceModalBody" class="p-6 max-h-[70vh] overflow-y-auto">
          <!-- diisi JS -->
        </div>

        <div class="flex justify-end gap-3 p-6">
          <button id="cancelAttendanceBtn" class="px-4 py-2 rounded-lg border">
            Batal
          </button>

          <button
            id="saveAttendanceBtn"
            class="px-4 py-2 rounded-lg bg-blue-600 text-white"
          >
            Simpan
          </button>
        </div>
      </div>
    </div>

    <!-- JS MODULE -->
    <script type="module" src="../../js/attendanceMonitoring.js"></script>
  </body>
</html>
