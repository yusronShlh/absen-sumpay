<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laporan absensi guru</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />
  </head>

  <body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen">
      <div id="sidebar-container"></div>

      <div class="flex-1 w-full overflow-y-auto">
        <div
          class="md:hidden flex justify-between items-center bg-[#C3D9E6] p-4"
        >
          <h2 class="font-bold text-[#1E3A5F]">SUMPAY.Edu</h2>
          <button onclick="toggleSidebar()" class="text-2xl text-[#1E3A5F]">
            ☰
          </button>
        </div>
        <div class="p-6 md:p-8">
          <div>
            <h2 class="text-3xl font-bold text-[#1E3A5F]">
              Laporan Absensi Siswa
            </h2>
          </div>

          <div
            class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mt-6 mb-8"
          >
            <div class="flex flex-col lg:flex-row items-end gap-4">
              <div
                class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 w-full lg:flex-1"
              >
                <div class="w-full">
                  <label
                    class="block text-sm font-semibold text-slate-600 mb-2"
                  >
                    Jenis Periode
                  </label>
                  <select
                    id="periodeType"
                    class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Pilih periode</option>
                    <option value="semester">Semester</option>
                    <option value="month">Bulan</option>
                  </select>
                </div>

                <div id="semesterWrapper" class="w-full hidden">
                  <label
                    class="block text-sm font-semibold text-slate-600 mb-2"
                  >
                    Pilih Semester
                  </label>
                  <select
                    id="filterSemester"
                    class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Pilih semester</option>
                  </select>
                </div>

                <div id="monthWrapper" class="w-full hidden">
                  <label
                    class="block text-sm font-semibold text-slate-600 mb-2"
                  >
                    Pilih Bulan
                  </label>
                  <select
                    id="filterMonth"
                    class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Pilih bulan</option>
                  </select>
                </div>

                <div class="w-full">
                  <label
                    class="block text-sm font-semibold text-slate-600 mb-2"
                  >
                    Pilih Kelas
                  </label>
                  <select
                    id="filterKelas"
                    disabled
                    class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Pilih kelas</option>
                  </select>
                </div>

                <div class="w-full">
                  <label
                    class="block text-sm font-semibold text-slate-600 mb-2"
                  >
                    Pilih mapel
                  </label>
                  <select
                    id="filterMapel"
                    disabled
                    class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Pilih mapel</option>
                  </select>
                </div>
              </div>

              <div class="flex flex-row w-full lg:w-auto gap-3 pt-2 lg:pt-0">
                <button
                  id="btnTampilkanData"
                  class="flex-1 lg:flex-none justify-center bg-[#1E3A5F] text-white px-6 py-2.5 rounded-xl shadow-md hover:bg-[#2a5285] active:scale-95 transition-all flex items-center gap-2 text-sm font-medium whitespace-nowrap"
                >
                  <i data-lucide="eye" class="w-4 h-4"></i>
                  <span>Tampilkan</span>
                </button>

                <button
                  id="btnExportPDF"
                  class="flex-1 lg:flex-none justify-center bg-emerald-600 text-white px-6 py-2.5 rounded-xl shadow-md hover:bg-emerald-700 active:scale-95 transition-all flex items-center gap-2 text-sm font-medium whitespace-nowrap"
                >
                  <i data-lucide="file-text" class="w-4 h-4"></i>
                  <span>PDF</span>
                </button>
              </div>
            </div>
          </div>

          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm text-left">
                <thead class="bg-[#C3D9E6]/40 text-[#1E3A5F]">
                  <tr>
                    <th
                      rowspan="2"
                      class="px-4 py-3 text-center border-r border-gray-200 w-16"
                    >
                      No
                    </th>

                    <th
                      rowspan="2"
                      class="px-6 py-3 text-center border-r border-gray-200"
                    >
                      Nama
                    </th>

                    <th colspan="4" class="px-6 py-3 text-center">
                      Keterangan
                    </th>
                  </tr>

                  <tr>
                    <th class="px-4 py-2 text-center">Total</th>
                    <th class="px-4 py-2 text-center">Hadir</th>
                    <th class="px-4 py-2 text-center">Izin</th>
                    <th class="px-4 py-2 text-center">Alpha</th>
                  </tr>
                </thead>

                <tbody
                  id="AdminAttendanceTableBody"
                  class="divide-y divide-gray-100"
                ></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { loadSidebar } from "../../js/components/sidebar.js";

      loadSidebar();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <script type="module" src="../../js/studentAttendanceReport.js"></script>
  </body>
</html>
