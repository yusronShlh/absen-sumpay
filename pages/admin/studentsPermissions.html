<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Data Siswa</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />
  </head>

  <body class="bg-slate-50 overflow-hidden">
    <div class="flex h-screen">
      <div id="sidebar-container"></div>

      <!-- MAIN CONTENT -->
      <div class="flex-1 w-full overflow-y-auto">
        <!-- MOBILE TOP NAV -->
        <div
          class="md:hidden flex justify-between items-center bg-[#C3D9E6] p-4"
        >
          <h2 class="font-bold text-[#1E3A5F]">SUMPAY.Edu</h2>
          <button onclick="toggleSidebar()" class="text-2xl text-[#1E3A5F]">
            ☰
          </button>
        </div>
        <div>
          <!-- CONTENT WRAPPER -->
          <main class="p-4 sm:p-6 md:p-8">
            <!-- Page Header -->
            <div class="mb-8">
              <h2 class="text-3xl font-bold text-[#1E3A5F]">
                Kelola Izin Siswa
              </h2>
              <!-- <p class="text-gray-500 text-sm">Manajemen data kelas sekolah</p> -->
            </div>

            <!-- FILTER STATUS -->
            <div
              class="flex gap-2 mb-6 overflow-x-auto pb-1 scrollbar-hide"
              id="permissionFilter"
            >
              <button
                data-filter="all"
                class="filter-btn px-4 py-2 text-sm font-medium rounded-xl transition-all duration-200 shadow-sm"
              >
                Semua
              </button>

              <button
                data-filter="pending"
                class="filter-btn px-4 py-2 text-sm font-medium rounded-xl transition-all duration-200 shadow-sm"
              >
                Menunggu
              </button>

              <button
                data-filter="approved"
                class="filter-btn px-4 py-2 text-sm font-medium rounded-xl transition-all duration-200 shadow-sm"
              >
                Disetujui
              </button>

              <button
                data-filter="rejected"
                class="filter-btn px-4 py-2 text-sm font-medium rounded-xl transition-all duration-200 shadow-sm"
              >
                Ditolak
              </button>
            </div>
            <!-- SECTION IZIN HARI INI -->
            <section class="mb-10">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-700">
                  Daftar Izin Siswa
                </h2>

                <!-- Badge jumlah -->
                <span
                  id="permissionCount"
                  class="px-3 py-1 text-xs font-medium rounded-full bg-[#C3D9E6] text-[#1E3A5F]"
                >
                  0 Izin
                </span>
              </div>

              <div id="todayPermissionList" class="space-y-4">
                <!-- Rendered by studentPermissions.js -->
              </div>
            </section>
          </main>
        </div>
      </div>
    </div>

    <!-- SIDEBAR SCRIPT -->
    <script type="module">
      import { loadSidebar } from "../../js/components/sidebar.js";

      loadSidebar();
    </script>

    <!-- SWEETALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- icon -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Modal dialog -->
    <!-- DETAIL MODAL -->
    <dialog
      id="permissionDetailModal"
      class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-2xl p-0 w-[500px] max-w-[95%] backdrop:bg-black/40 backdrop:backdrop-blur-sm"
    >
      <div class="p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold text-[#1E3A5F]">Detail Izin</h3>
          <button
            id="closeDetailModal"
            class="text-gray-400 hover:text-gray-600 transition"
          >
            ✕
          </button>
        </div>

        <div
          id="detailContent"
          class="text-sm text-gray-600 leading-relaxed space-y-2"
        >
          <!-- Injected by JS -->
        </div>
      </div>
    </dialog>

    <!-- JS MODULE -->
    <script type="module" src="../../js/studentPermissions.js"></script>
  </body>
</html>
