<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Detail Rekap</title>

    <link href="../../assets/css/output.css" rel="stylesheet" />
  </head>

  <body class="bg-gray-100 min-h-screen">
    <div id="navbar-container"></div>

    <main class="p-4 md:p-6">
      <section class="bg-white rounded-xl shadow p-5">
        <h1 class="text-xl font-bold text-[#1E3A5F] mb-5">
          Detail Rekapitulasi
        </h1>

        <!-- INFO -->

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
          <div class="bg-slate-50 rounded-lg p-4">
            <p class="text-sm text-gray-500">Nama Mapel</p>

            <p id="subjectName" class="font-semibold text-[#1E3A5F]">-</p>

            <p class="text-sm text-gray-500">Kelas</p>

            <p id="className" class="font-semibold text-[#1E3A5F]">-</p>
          </div>
        </div>

        <!-- SEMESTER -->

        <div
          class="mb-5 flex flex-col md:flex-row md:items-end md:justify-between gap-4"
        >
          <!-- FILTER -->

          <div class="flex items-center gap-3 w-full md:w-auto">
            <label
              for="semesterSelect"
              class="text-sm text-gray-600 whitespace-nowrap"
            >
              Tampilkan :
            </label>

            <select
              id="semesterSelect"
              class="w-full md:w-auto border rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1E3A5F]/30"
            >
              <option value="">Pilih semester</option>
            </select>
          </div>

          <!-- EXPORT -->

          <button
            id="btnExportPDF"
            class="w-full md:w-auto justify-center bg-emerald-600 text-white px-5 py-2.5 rounded-xl shadow-md hover:bg-emerald-700 active:scale-95 transition-all flex items-center gap-2 text-sm font-medium"
          >
            <i data-lucide="file-text" class="w-4 h-4"></i>

            <span> PDF </span>
          </button>
        </div>

        <!-- TABLE -->

        <div
          id="tableContainer"
          class="hidden overflow-x-auto rounded-xl shadow-sm"
        >
          <table class="w-full text-sm border-separate border-spacing-0">
            <thead class="bg-[#C3D9E6]/70">
              <tr id="tableHeader">
                <th class="px-3 py-3 whitespace-nowrap">Nama Siswa</th>

                <!-- pertemuan masuk sini -->

                <th class="px-3 py-3">Hadir</th>

                <th class="px-3 py-3">Izin</th>

                <th class="px-3 py-3">Sakit</th>

                <th class="px-3 py-3">Alpha</th>
              </tr>
            </thead>

            <tbody id="recapTable"></tbody>
          </table>
        </div>

        <div id="emptyState" class="text-center text-gray-400 py-10">
          Pilih semester untuk melihat rekap
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module" src="../../js/teacher/recap-detail.js"></script>
  </body>
</html>
