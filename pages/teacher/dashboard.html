<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Guru</title>

    <link href="../../assets/css/output.css" rel="stylesheet" />

    <link
      rel="icon"
      href="../../assets/images/favico.ico"
      type="image/x-icon"
    />
  </head>

  <body class="bg-gray-100 min-h-screen">
    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <main class="p-4 md:p-6">
      <!-- HEADER -->

      <section class="bg-white rounded-xl shadow p-4 md:p-6 mb-6">
        <!-- p-4 di mobile, p-6 di desktop -->
        <div
          class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 md:gap-5"
        >
          <div class="flex items-center gap-4">
            <div>
              <!-- text-xs di mobile, text-sm di desktop -->
              <p class="text-gray-500 text-xs md:text-sm">Selamat datang</p>

              <!-- text-xl di mobile, text-2xl di desktop -->
              <h1
                id="teacherName"
                class="text-xl md:text-2xl font-bold text-[#1E3A5F]"
              >
                Guru
              </h1>
            </div>
          </div>

          <!-- text-xs di mobile, text-sm di desktop -->
          <div
            id="todayDate"
            class="text-xs md:text-sm font-medium text-gray-600"
          ></div>
        </div>
      </section>

      <!-- CARDS -->

      <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <!-- JADWAL -->

        <div class="bg-white rounded-xl shadow p-5 xl:col-span-2">
          <h2 class="font-semibold text-[#1E3A5F] mb-4">Mapel Hari Ini</h2>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-100 text-slate-600">
                <tr>
                  <th class="px-4 py-3 text-left">Jam</th>

                  <th class="px-4 py-3 text-left">Mata Pelajaran</th>

                  <th class="px-4 py-3 text-left">Jam</th>

                  <th class="px-4 py-3 text-left">Kelas</th>
                </tr>
              </thead>

              <tbody id="todaySchedule">
                <tr>
                  <td colspan="4" class="text-center py-5 text-gray-400">
                    Belum ada jadwal
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- STATISTIK -->

        <!-- STATISTIK -->

        <div class="bg-white rounded-xl shadow p-5">
          <h2 class="font-semibold text-[#1E3A5F] mb-4">Statistik Kehadiran</h2>

          <div class="flex justify-center items-center">
            <div
              class="w-40 h-40 sm:w-44 sm:h-44 md:w-52 md:h-52 lg:w-56 lg:h-56"
            >
              <canvas id="attendanceChart"></canvas>
            </div>
          </div>
        </div>
        <!-- IZIN -->

        <div class="bg-white rounded-xl shadow p-5 xl:col-span-3">
          <h2 class="font-semibold text-[#1E3A5F] mb-4">3 Izin Terakhir</h2>

          <div id="latestPermission" class="space-y-3 divide-y divide-gray-100">
            <div class="p-3 rounded-lg bg-gray-50">
              <p class="font-medium">Belum ada data</p>

              <p class="text-sm text-gray-500">-</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="../../js/teacher/dashboard.js"></script>
  </body>
</html>
