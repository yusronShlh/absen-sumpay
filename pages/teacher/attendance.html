<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Absensi Siswa</title>

    <link href="../../assets/css/output.css" rel="stylesheet" />

    <link
      rel="icon"
      href="../../assets/images/favico.ico"
      type="image/x-icon"
    />
  </head>

  <body class="bg-gray-100 min-h-screen">
    <!-- NAVBAR -->

    <div id="navbar-container"></div>

    <main class="p-4 md:p-6">
      <!-- SELECT CARD -->

      <section class="bg-white rounded-xl shadow p-5 mb-6">
        <h1 class="text-xl font-bold text-[#1E3A5F] mb-4">Absensi Siswa</h1>

        <label class="text-sm text-gray-600"> Pilih Mapel </label>

        <select
          id="scheduleSelect"
          class="mt-2 w-full border rounded-lg px-4 py-3"
        >
          <option value="">Pilih jadwal</option>
        </select>
      </section>

      <!-- TABLE CARD -->

      <section class="bg-white rounded-xl shadow p-5">
        <div class="flex justify-between items-center mb-4">
          <!-- <h2 class="font-semibold text-[#1E3A5F]">Daftar Siswa</h2> -->
        </div>

        <div class="overflow-x-auto mb-4">
          <table class="w-full text-sm">
            <thead class="bg-[#C3D9E6]">
              <tr>
                <th class="px-4 py-3 text-left">No</th>

                <th class="px-4 py-3 text-left">Nama</th>

                <th class="px-4 py-3 text-center">Keterangan</th>
              </tr>
            </thead>

            <tbody id="studentTable">
              <tr>
                <td colspan="3" class="text-center py-5 text-gray-400">
                  Pilih jadwal terlebih dahulu
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <button
          id="submitAttendance"
          class="bg-[#C3D9E6] text-black px-4 py-2 rounded-lg hover:opacity-90 w-full mt-8"
        >
          Submit
        </button>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../js/teacher/attendance.js"></script>
  </body>
</html>
